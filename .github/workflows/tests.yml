name: Tests & Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-ci:
    name: Quality CI (Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          BOT_TOKEN: "test_token_for_ci"
        run: pytest -v

  project-ci:
    name: Project CI (Generate Report)
    runs-on: ubuntu-latest
    needs: quality-ci   # Запускается только если тесты прошли
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate report
        env:
          BOT_TOKEN: "test_token_for_ci"
        run: python scripts/generate_report.py
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-report
          path: report.csv